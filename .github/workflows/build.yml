name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备代号'
        required: true
        default: 'elish'
        type: choice
        options:
          - psyche
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      include_ksu:
        description: '选择KSU版本'
        required: true
        default: 'ksu'
        type: choice
        options:
          - 'ksu'
          - 'rksu'
          - 'noksu'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 unzip

    # 生成短哈希（修复 substr() 报错）
    - name: Set short commit SHA
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-ccache-${{ env.SHORT_SHA }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Setup ZyC-clang toolchain
      run: |
        mkdir -p $HOME/ZyC-clang
        cd $HOME/ZyC-clang
        wget https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250924-release/Clang-22.0.0git-20250924.tar.gz
        tar -zxf Clang-22.0.0git-20250924.tar.gz
        cd $GITHUB_WORKSPACE

    - name: Build kernel
      run: |
        case "${{ github.event.inputs.include_ksu }}" in
          "ksu")
            bash build.sh ${{ github.event.inputs.device }} ksu
            ;;
          "rksu")
            bash build.sh ${{ github.event.inputs.device }} rksu
            ;;
          "noksu")
            bash build.sh ${{ github.event.inputs.device }}
            ;;
        esac

    - name: Show ccache stats
      run: ccache -s

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.device }}-${{ github.event.inputs.include_ksu == 'noksu' && 'vanilla' || github.event.inputs.include_ksu }}-kernel
        path: |
          *.zip
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
