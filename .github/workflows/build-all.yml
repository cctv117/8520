name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备代号'
        required: true
        default: 'alioth'
        type: choice
        options:
          - psyche
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      ksu_type:
        description: 'KernelSU类型'
        required: false
        default: 'SukiSU-Ultra'
        type: choice
        options:
          - 'none'
          - 'SukiSU-Ultra'
          - 'rksu'
      build_type:
        description: '构建类型'
        required: false
        default: 'miui'
        type: choice
        options:
          - 'all'
          - 'aosp'
          - 'miui'

env:
  CCACHE_DIR: /home/runner/.ccache_kernel_4.19
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: 安装依赖
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar libelf-dev patch

    - name: 生成短哈希
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: 配置ccache优化
      run: |
        mkdir -p ${{ env.CCACHE_DIR }}
        if command -v ccache >/dev/null 2>&1; then
            ccache -o max_size=${{ env.CCACHE_MAXSIZE }} 2>/dev/null || echo "ccache配置可能失败，但继续执行"
            ccache -o compression=true 2>/dev/null || true
            ccache -o compression_level=6 2>/dev/null || true
            ccache -o sloppiness=file_macro,locale,time_macros 2>/dev/null || true
            ccache -o hash_dir=false 2>/dev/null || true
            ccache -o hard_link=true 2>/dev/null || true
            echo "ccache配置完成"
        else
            echo "警告: ccache命令未找到，但构建将继续进行"
        fi

    - name: 恢复ccache缓存
      uses: actions/cache@v4
      id: ccache-restore
      with:
        path: ${{ env.CCACHE_DIR }}
        key: kernel-ccache-${{ runner.os }}-4.19-${{ hashFiles('arch/arm64/configs/*_defconfig', 'build.sh') }}
        restore-keys: |
          kernel-ccache-${{ runner.os }}-4.19-
      continue-on-error: true

    - name: 设置ZYC Clang工具链
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxf Clang-15.0.7-20251111.tar.gz
        rm -f Clang-15.0.7-20251111.tar.gz
        cd $GITHUB_WORKSPACE

    - name: 添加KernelSU
      id: ksu_version
      run: |
        if [[ "${{ github.event.inputs.ksu_type }}" == "SukiSU-Ultra" ]]; then
          echo "正在配置SukiSU Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/tmp-builtin/kernel/setup.sh" | bash -s tmp-builtin
          cd ./KernelSU
          
          # 获取当前 Git 提交的短哈希 (7位)
          GIT_COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          echo "当前提交哈希: $GIT_COMMIT_HASH"
          export KSU_VERSION=$KSU_VERSION
          
          # 尝试最多 3 次获取 KernelSU API 版本号
          for i in {1..3}; do
            KSU_API_VERSION=$(curl -s "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/tmp-builtin/kernel/Kbuild" | 
              grep -m1 "KSU_VERSION_API :=" | 
              awk -F'= ' '{print $2}' | 
              tr -d '[:space:]')
            [ -n "$KSU_API_VERSION" ] && break || sleep 1
          done
          [ -z "$KSU_API_VERSION" ] && KSU_API_VERSION="4.1.0"
          echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV
          
          CALCULATED_VERSION=$(expr $(git rev-list --count main) + 37185 2>/dev/null || echo 114514)
          
          VERSION_DEFINITIONS=$'define get_ksu_version_full\n"v\\$1-'"$GIT_COMMIT_HASH"'@ Or so. 左右-'"$CALCULATED_VERSION"$'"\nendef\n\nKSU_VERSION_API := '"$KSU_API_VERSION"$'\nKSU_VERSION_FULL := "v'"$KSU_API_VERSION"$'-'"$GIT_COMMIT_HASH"'@ Or so. 左右-'"$CALCULATED_VERSION"$'"'
          
          sed -i '/define get_ksu_version_full/,/endef/d' kernel/Kbuild
          sed -i '/KSU_VERSION_API :=/d' kernel/Kbuild
          sed -i '/KSU_VERSION_FULL :=/d' kernel/Kbuild
          
          awk -v def="$VERSION_DEFINITIONS" '
            /REPO_OWNER :=/ {print; print def; inserted=1; next}
            1
            END {if (!inserted) print def}
          ' kernel/Kbuild > kernel/Kbuild.tmp && mv kernel/Kbuild.tmp kernel/Kbuild

          echo "KSUVER=$CALCULATED_VERSION" >> $GITHUB_ENV
          echo "ksuver=$CALCULATED_VERSION" >> $GITHUB_OUTPUT
          echo "KSU_VERSION_FULL=\"v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@ Or so. 左右-${CALCULATED_VERSION}\"" >> $GITHUB_ENV

          echo "=== 验证版本定义 ==="
          grep -A10 "REPO_OWNER" kernel/Kbuild
          grep "KSU_VERSION_FULL" kernel/Kbuild
          echo "SukiSU版本号: \"v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@ Or so. 左右-${CALCULATED_VERSION}\""
          
          cd $GITHUB_WORKSPACE

        elif [[ "${{ github.event.inputs.ksu_type }}" == "rksu" ]]; then
          echo "正在配置RKSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "RKSU配置完成"
        else
          echo "不使用KernelSU"
        fi

    - name: 构建内核
      env:
        KSU_VERSION_FULL: ${{ env.KSU_VERSION_FULL }}
        KSU_API_VERSION: ${{ env.KSU_API_VERSION }}
        CCACHE_DIR: ${{ env.CCACHE_DIR }}
        CCACHE_MAXSIZE: ${{ env.CCACHE_MAXSIZE }}
      run: |
        # 设置ccache环境变量
        export PATH="/usr/lib/ccache:$PATH"
        export CC="ccache clang"
        export CXX="ccache clang++"
        
        echo "=== 构建环境信息 ==="
        echo "设备: ${{ github.event.inputs.device }}"
        echo "KSU类型: ${{ github.event.inputs.ksu_type }}"
        echo "构建类型: ${{ github.event.inputs.build_type }}"
        echo "KSU版本: $KSU_VERSION_FULL"
        echo "KSU API: $KSU_API_VERSION"
        echo "CCACHE_DIR: $CCACHE_DIR"
        echo "CCACHE_MAXSIZE: $CCACHE_MAXSIZE"
        
        # 安全显示ccache状态
        echo "ccache状态:"
        if command -v ccache >/dev/null 2>&1; then
            ccache -s 2>/dev/null || echo "ccache统计信息暂时不可用（首次运行正常）"
        else
            echo "ccache未安装，但构建将继续"
        fi
        
        # 参数映射
        BUILD_TYPE_ARG=""
        case "${{ github.event.inputs.build_type }}" in
            "aosp") BUILD_TYPE_ARG="--aosp" ;;
            "miui") BUILD_TYPE_ARG="--miui" ;;
        esac
        
        KSU_TYPE_ARG="${{ github.event.inputs.ksu_type }}"
        [[ "$KSU_TYPE_ARG" == "SukiSU-Ultra" ]] && KSU_TYPE_ARG="ksu"
        
        if [ -f "build.sh" ]; then
            chmod +x build.sh
            echo "开始构建..."
            time ./build.sh "${{ github.event.inputs.device }}" "$KSU_TYPE_ARG" "$BUILD_TYPE_ARG"
        else
            echo "错误: build.sh 不存在"
            exit 1
        fi

    - name: 显示ccache统计信息
      run: |
        echo "=== 构建后ccache统计 ==="
        if command -v ccache >/dev/null 2>&1; then
            ccache -s 2>/dev/null || echo "无法获取ccache统计信息"
        else
            echo "ccache命令未安装"
        fi

    - name: 检查构建产物
      run: |
        echo "=== 生成的刷机包 ==="
        find . -name "Kernel_*.zip" -type f -exec ls -lh {} \; | while read line; do
          echo "📦 $line"
        done || echo "未找到zip文件"

    - name: 上传内核包
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ github.event.inputs.device }}-${{ github.event.inputs.ksu_type != 'none' && github.event.inputs.ksu_type || 'noksu' }}-${{ github.event.inputs.build_type }}
        path: Kernel_*.zip
        retention-days: 7
        if-no-files-found: ignore

    - name: 保存ccache缓存
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: kernel-ccache-${{ runner.os }}-4.19-${{ hashFiles('arch/arm64/configs/*_defconfig', 'build.sh') }}-${{ env.SHORT_SHA }}
        restore-keys: |
          kernel-ccache-${{ runner.os }}-4.19-

    - name: 构建完成摘要
      run: |
        echo "=== 构建完成摘要 ==="
        echo "设备: ${{ github.event.inputs.device }}"
        echo "KernelSU类型: ${{ github.event.inputs.ksu_type }}"
        echo "构建类型: ${{ github.event.inputs.build_type }}"
        echo "工作流运行编号: ${{ github.run_number }}"
        echo "提交哈希: ${{ github.sha }}"
        echo "构建时间: $(date)"
        
        if [[ "${{ github.event.inputs.ksu_type }}" == "SukiSU-Ultra" ]]; then
          echo "自定义版本: ${{ env.KSU_VERSION_FULL }}"
        fi
        
        echo "生成的刷机包:"
        find . -name "Kernel_*.zip" -exec echo "  📦 {}" \; 2>/dev/null || echo "  未找到刷机包"
