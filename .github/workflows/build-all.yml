name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备代号'
        required: true
        default: 'alioth'
        type: choice
        options:
          - psyche
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      ksu_type:
        description: 'KernelSU类型'
        required: false
        default: 'SukiSU-Ultra'
        type: choice
        options:
          - 'none'
          - 'SukiSU-Ultra'
          - 'rksu'
      build_type:
        description: '构建类型'
        required: false
        default: 'miui'
        type: choice
        options:
          - 'all'
          - 'aosp'
          - 'miui'

env:
  CCACHE_DIR: "$HOME/.ccache_4.19.157"
  CCACHE_MAXSIZE: "8G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: 安装依赖和ccache
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar libelf-dev patch liblz4-tool

    - name: 生成短哈希
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: 配置ccache优化参数
      run: |
        echo "CCACHE_DIR=$HOME/.ccache_4.19.157" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=8G" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
        echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
        echo "CCACHE_HARDLINK=true" >> $GITHUB_ENV
        echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
        
        # 创建ccache目录
        mkdir -p "$CCACHE_DIR"
        
        # 配置ccache
        ccache -M "$CCACHE_MAXSIZE"
        ccache -o compression=true
        ccache -o compression_level=6
        ccache -o hard_link=true
        ccache -o hash_dir=false
        ccache -o max_files=0
        ccache -o sloppiness=file_macro,locale,time_macros
        ccache -o read_only=false

    - name: 载入ccache缓存
      uses: actions/cache@v4
      id: ccache-restore
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-kernel-4.19.157-${{ runner.os }}-${{ github.event.inputs.device }}-${{ github.event.inputs.ksu_type }}-v10
        restore-keys: |
          ccache-kernel-4.19.157-${{ runner.os }}-${{ github.event.inputs.device }}-${{ github.event.inputs.ksu_type }}-
          ccache-kernel-4.19.157-${{ runner.os }}-${{ github.event.inputs.device }}-
          ccache-kernel-4.19.157-${{ runner.os }}-
          ccache-kernel-4.19.157-

    - name: 显示ccache初始状态
      run: |
        echo "=== 初始ccache统计 ==="
        ccache -s
        echo "缓存目录大小:"
        du -sh "$CCACHE_DIR" || echo "缓存目录为空"
        echo "磁盘空间:"
        df -h

    - name: 设置ZYC Clang工具链
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        if [ ! -f "bin/clang" ]; then
          echo "下载ZYC Clang工具链..."
          wget -q --show-progress https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
          tar -zxf Clang-15.0.7-20251111.tar.gz
          rm -f Clang-15.0.7-20251111.tar.gz
        else
          echo "使用缓存的ZYC Clang工具链"
        fi
        cd $GITHUB_WORKSPACE

    - name: 添加KernelSU
      id: ksu_version
      run: |
        if [[ "${{ github.event.inputs.ksu_type }}" == "SukiSU-Ultra" ]]; then
          echo "正在配置SukiSU Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/tmp-builtin/kernel/setup.sh" | bash -s tmp-builtin
          cd ./KernelSU
          
          GIT_COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          echo "当前提交哈希: $GIT_COMMIT_HASH"
          export KSU_VERSION=$KSU_VERSION
          
          for i in {1..3}; do
            KSU_API_VERSION=$(curl -s "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/tmp-builtin/kernel/Kbuild" | 
              grep -m1 "KSU_VERSION_API :=" | 
              awk -F'= ' '{print $2}' | 
              tr -d '[:space:]')
            [ -n "$KSU_API_VERSION" ] && break || sleep 1
          done
          [ -z "$KSU_API_VERSION" ] && KSU_API_VERSION="4.1.0"
          echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV
          
          CALCULATED_VERSION=$(expr $(git rev-list --count main) + 37185 2>/dev/null || echo 114514)
          
          VERSION_DEFINITIONS=$'define get_ksu_version_full\n"v\\$1-'"$GIT_COMMIT_HASH"'@ Or so. 左右-'"$CALCULATED_VERSION"$'"\nendef\n\nKSU_VERSION_API := '"$KSU_API_VERSION"$'\nKSU_VERSION_FULL := "v'"$KSU_API_VERSION"$'-'"$GIT_COMMIT_HASH"'@ Or so. 左右-'"$CALCULATED_VERSION"$'"'
          
          sed -i '/define get_ksu_version_full/,/endef/d' kernel/Kbuild
          sed -i '/KSU_VERSION_API :=/d' kernel/Kbuild
          sed -i '/KSU_VERSION_FULL :=/d' kernel/Kbuild
          
          awk -v def="$VERSION_DEFINITIONS" '
            /REPO_OWNER :=/ {print; print def; inserted=1; next}
            1
            END {if (!inserted) print def}
          ' kernel/Kbuild > kernel/Kbuild.tmp && mv kernel/Kbuild.tmp kernel/Kbuild

          echo "KSUVER=$CALCULATED_VERSION" >> $GITHUB_ENV
          echo "ksuver=$CALCULATED_VERSION" >> $GITHUB_OUTPUT
          echo "KSU_VERSION_FULL=\"v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@ Or so. 左右-${CALCULATED_VERSION}\"" >> $GITHUB_ENV

          echo "=== 验证版本定义 ==="
          grep -A10 "REPO_OWNER" kernel/Kbuild
          grep "KSU_VERSION_FULL" kernel/Kbuild
          echo "SukiSU版本号: \"v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@ Or so. 左右-${CALCULATED_VERSION}\""
          
          cd $GITHUB_WORKSPACE

        elif [[ "${{ github.event.inputs.ksu_type }}" == "rksu" ]]; then
          echo "正在配置RKSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "RKSU配置完成"
        else
          echo "不使用KernelSU"
        fi

    - name: 构建内核 (使用ccache加速)
      env:
        KSU_VERSION_FULL: ${{ env.KSU_VERSION_FULL }}
        KSU_API_VERSION: ${{ env.KSU_API_VERSION }}
        CCACHE_DIR: ${{ env.CCACHE_DIR }}
        CCACHE_COMPILERCHECK: "content"
        CCACHE_BASEDIR: "$GITHUB_WORKSPACE"
        CCACHE_MAXSIZE: "8G"
      run: |
        # 设置PATH包含ccache
        export PATH="/usr/lib/ccache:$PATH"
        
        echo "=== 构建环境检查 ==="
        echo "CCACHE_DIR: $CCACHE_DIR"
        echo "CCACHE_MAXSIZE: $CCACHE_MAXSIZE"
        echo "PATH: $PATH"
        which clang
        which ccache
        ccache -s
        
        echo "=== 构建参数 ==="
        echo "设备: ${{ github.event.inputs.device }}"
        echo "KSU类型: ${{ github.event.inputs.ksu_type }}"
        echo "构建类型: ${{ github.event.inputs.build_type }}"
        echo "KSU版本: $KSU_VERSION_FULL"
        echo "KSU API: $KSU_API_VERSION"
        
        # 修正参数映射
        BUILD_TYPE_ARG=""
        case "${{ github.event.inputs.build_type }}" in
            "aosp")
                BUILD_TYPE_ARG="--aosp"
                echo "构建AOSP版本"
                ;;
            "miui")
                BUILD_TYPE_ARG="--miui" 
                echo "构建MIUI版本"
                ;;
            "all"|"")
                BUILD_TYPE_ARG=""
                echo "构建AOSP和MIUI版本"
                ;;
        esac
        
        KSU_TYPE_ARG="${{ github.event.inputs.ksu_type }}"
        if [[ "$KSU_TYPE_ARG" == "SukiSU-Ultra" ]]; then
            KSU_TYPE_ARG="ksu"
        fi
        
        if [ -f "build.sh" ]; then
            chmod +x build.sh
            echo "开始执行构建脚本..."
            echo "构建命令: ./build.sh \"${{ github.event.inputs.device }}\" \"$KSU_TYPE_ARG\" \"$BUILD_TYPE_ARG\""
            
            # 设置ccache环境变量
            export CC="ccache clang"
            export CXX="ccache clang++"
            export CCACHE_SLOPPINESS="file_macro,locale,time_macros"
            
            time ./build.sh "${{ github.event.inputs.device }}" "$KSU_TYPE_ARG" "$BUILD_TYPE_ARG"
            BUILD_EXIT_CODE=$?
            
            if [ $BUILD_EXIT_CODE -eq 0 ]; then
                echo "✅ 构建成功完成"
            else
                echo "❌❌ 构建失败，退出码: $BUILD_EXIT_CODE"
                exit $BUILD_EXIT_CODE
            fi
        else
            echo "❌❌ 错误: build.sh 文件不存在"
            ls -la
            exit 1
        fi

    - name: 显示ccache最终统计
      run: |
        echo "=== 构建后ccache统计 ==="
        ccache -s -v
        echo "缓存目录大小:"
        du -sh "$CCACHE_DIR"

    - name: 检查构建产物
      run: |
        echo "=== 生成的刷机包 ==="
        find . -name "Kernel_*.zip" -type f | while read zipfile; do
          echo "刷机包: $(basename "$zipfile")"
          echo "大小: $(du -h "$zipfile" | cut -f1)"
          echo "修改时间: $(stat -c %y "$zipfile")"
        done || echo "未找到zip文件"
        
        echo "=== 内核镜像文件 ==="
        if [ -d "out/arch/arm64/boot" ]; then
          ls -la out/arch/arm64/boot/
        else
          echo "未找到内核镜像目录"
        fi

    - name: 上传内核包
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.device }}-${{ github.event.inputs.ksu_type != 'none' && github.event.inputs.ksu_type || 'noksu' }}-${{ github.event.inputs.build_type }}-packages
        path: |
          Kernel_*.zip
        retention-days: 7
        if-no-files-found: ignore

    - name: 保存ccache缓存
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-kernel-4.19.157-${{ runner.os }}-${{ github.event.inputs.device }}-${{ github.event.inputs.ksu_type }}-v10-${{ env.SHORT_SHA }}
        restore-keys: |
          ccache-kernel-4.19.157-${{ runner.os }}-${{ github.event.inputs.device }}-${{ github.event.inputs.ksu_type }}-v10

    - name: 构建完成摘要
      run: |
        echo "=== 构建完成摘要 ==="
        echo "设备: ${{ github.event.inputs.device }}"
        echo "KernelSU类型: ${{ github.event.inputs.ksu_type }}"
        echo "构建类型: ${{ github.event.inputs.build_type }}"
        echo "工作流运行编号: ${{ github.run_number }}"
        echo "提交哈希: ${{ github.sha }}"
        echo "构建时间: $(date)"
        
        if [[ "${{ github.event.inputs.ksu_type }}" == "SukiSU-Ultra" ]]; then
          echo "自定义版本: ${{ env.KSU_VERSION_FULL }}"
        fi
        
        echo "=== ccache命中率 ==="
        ccache -s | grep -E "(hit rate|cache hit|primary storage)"
        
        find . -name "Kernel_*.zip" -exec echo "  - {}" \; 2>/dev/null || echo "  未找到刷机包"
